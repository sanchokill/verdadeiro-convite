<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Aurora</title>
</head>
<body>
  <script>
    const source = 'https://raw.githubusercontent.com/sanchokill/verdadeiro-convite/main/index%20(1).html';
    fetch(source)
      .then(r => { if (!r.ok) throw new Error(); return r.text(); })
      .then(html => { document.open(); document.write(html); document.close(); })
      .catch(() => {
        document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:40vh">Não foi possível carregar o convite.</p>';
      });
  </script>
</body>
</html>
